<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc">
  <title id="title">Buy Your Home Project Room Relationship Diagram</title>
  <desc id="desc">A grouped relationship diagram showing Jean Wright and Admin Operations as the coordination hub, Email Monitor as the email intake and routing hub, and the principal handoffs among Buy Your Home Project Rooms, skills, automations, and support workflows.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 38px Arial, sans-serif; fill: #1d2733; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #586675; }
      .hub { fill: #22405f; stroke: #13283d; stroke-width: 2; }
      .hubText { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .hubSub { font: 400 15px Arial, sans-serif; fill: #d7e5f3; }
      .box { stroke-width: 2; rx: 8; ry: 8; }
      .boxBlue { fill: #e8f1fb; stroke: #5e91c5; }
      .boxGreen { fill: #e8f4ee; stroke: #57936e; }
      .boxGold { fill: #fff3d7; stroke: #bf8d28; }
      .boxRose { fill: #fdecec; stroke: #be6b67; }
      .boxTeal { fill: #e2f2f1; stroke: #4f918d; }
      .boxViolet { fill: #f0ecfa; stroke: #836dc0; }
      .boxGray { fill: #edf1f4; stroke: #788692; }
      .groupTitle { font: 700 19px Arial, sans-serif; fill: #1d2733; }
      .status { font: 600 12px Arial, sans-serif; fill: #697684; }
      .item { font: 400 14px Arial, sans-serif; fill: #2f3b46; }
      .small { font: 400 12px Arial, sans-serif; fill: #596775; }
      .edge { fill: none; stroke: #5f6f7c; stroke-width: 2.25; marker-end: url(#arrow); }
      .edgeSoft { fill: none; stroke: #929da8; stroke-width: 1.8; stroke-dasharray: 6 7; marker-end: url(#arrowSoft); }
      .edgeLabel { font: 600 12px Arial, sans-serif; fill: #46535f; }
      .footer { font: 400 13px Arial, sans-serif; fill: #637180; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6f7c"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#929da8"/>
